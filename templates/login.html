<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход для сотрудников — Отклик</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: #f7f9fc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-container {
            max-width: 440px;
            width: 100%;
            background: white;
            border-radius: 24px;
            padding: 40px 32px;
            box-shadow: 0 12px 48px rgba(0, 0, 0, 0.08);
        }

        .brand {
            text-align: center;
            margin-bottom: 28px;
        }

        .brand h1 {
            font-size: 28px;
            font-weight: 600;
            color: #1a1a2e;
        }

        .brand h1 span {
            color: #4f46e5;
        }

        .brand .subtitle {
            color: #5a5a7a;
            font-size: 15px;
            margin-top: 6px;
        }

        .badge {
            display: inline-block;
            background: #eef2ff;
            color: #4f46e5;
            font-size: 13px;
            font-weight: 500;
            padding: 4px 14px;
            border-radius: 20px;
            margin-bottom: 16px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 500;
            font-size: 14px;
            color: #1a1a2e;
            margin-bottom: 6px;
        }

        label .hint {
            font-weight: 400;
            color: #8888aa;
            font-size: 13px;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid #e2e8f0;
            border-radius: 12px;
            font-size: 15px;
            font-family: inherit;
            transition: border 0.2s;
            background: #fafbfc;
        }

        input:focus {
            outline: none;
            border-color: #4f46e5;
            background: white;
        }

        .btn {
            background: #4f46e5;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            width: 100%;
            margin-top: 8px;
        }

        .btn:hover {
            background: #4338ca;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .flash {
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .flash.danger {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }

        .flash.success {
            background: #d1fae5;
            color: #065f46;
            border: 1px solid #a7f3d0;
        }

        .divider {
            border: none;
            border-top: 1px solid #eef2f6;
            margin: 24px 0;
        }

        .test-accounts {
            background: #f8faff;
            border-radius: 12px;
            padding: 16px 20px;
            margin-top: 16px;
            font-size: 13px;
            color: #5a5a7a;
        }

        .test-accounts strong {
            color: #1a1a2e;
        }

        .test-accounts code {
            background: #eef2ff;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
            color: #4f46e5;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #4f46e5;
            text-decoration: none;
            font-weight: 500;
            font-size: 14px;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 24px 16px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="brand">
            <div class="badge">🔐 Для сотрудников</div>
            <h1>Отклик</h1>
            <p class="subtitle">Войдите в систему поддержки</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="flash {{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="post">
            <div class="form-group">
                <label for="username">Логин <span class="hint"></span></label>
                <input type="text" id="username" name="username" placeholder="Введите логин" required autofocus>
            </div>
            <div class="form-group">
                <label for="password">Пароль</label>
                <input type="password" id="password" name="password" placeholder="Введите пароль" required>
            </div>
            <button type="submit" class="btn">Войти</button>
        </form>

        <hr class="divider">
        <a href="/" class="back-link">← На главную</a>
    </div>
</body>
</html>
